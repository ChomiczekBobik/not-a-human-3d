<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>GLB probe</title>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
</head>
<body>
<pre id="out">start</pre>
<script type="module">
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log('[PROBE]', s); };
try {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  log('three ok');
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(640, 360);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1));
  const cam = new THREE.PerspectiveCamera(50, 640 / 360, 0.01, 100);
  cam.position.set(0, 1, 3);
  renderer.render(scene, cam);
  log('renderer ok');
  const url = new URLSearchParams(location.search).get('m') || 'assets/models/tripo_light.glb';
  log('loading ' + url);
  const t0 = performance.now();
  const gltf = await new GLTFLoader().loadAsync(url);
  log('loaded in ' + Math.round(performance.now() - t0) + 'ms');
  let meshes = 0, tris = 0;
  gltf.scene.traverse((n) => {
    if (n.isMesh) { meshes++; tris += (n.geometry.index ? n.geometry.index.count : n.geometry.attributes.position.count) / 3; }
  });
  log(`meshes=${meshes} tris=${tris}`);
  scene.add(gltf.scene);
  renderer.render(scene, cam);
  log('render calls=' + renderer.info.render.calls + ' tri=' + renderer.info.render.triangles);
  log('DONE');
} catch (e) {
  log('ERROR ' + (e && e.stack ? e.stack : e));
}
</script>
</body>
</html>
